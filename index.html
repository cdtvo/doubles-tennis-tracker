<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1D33" />
    <meta name="description" content="Live doubles tennis scoreboard, stats, and point history." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tennis Tracker" />
    <link rel="icon" type="image/png" href="./icons/favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Doubles Tennis Tracker</title>

    <!-- Tailwind's CDN build (JIT in the browser) since there's no build step here -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Map bare specifiers used by app.js to real ESM builds on a CDN.
         No npm install / bundler needed to run or deploy this site. -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
        }
      }
    </script>

    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #0B1D33; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
